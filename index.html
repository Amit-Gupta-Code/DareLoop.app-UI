<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Primary Meta Tags (fallback — overridden per-page by react-helmet-async) -->
    <title>Dareloop — Join Challenges. Build Streaks. Change Your Life.</title>
    <meta name="title" content="Dareloop — Join Challenges. Build Streaks. Change Your Life." />
    <meta name="description" content="The challenge platform where people start, share, and complete personal challenges with a community that keeps you accountable. Track streaks, compete on leaderboards, and stay motivated." />
    <meta name="keywords" content="challenge app, 30 day challenge tracker, habit challenge, accountability app, streak tracker, fitness challenge, self improvement app, challenge community" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Dareloop" />
    <meta name="language" content="English" />
    <link rel="canonical" href="https://www.dareloop.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.dareloop.app/" />
    <meta property="og:site_name" content="Dareloop" />
    <meta property="og:title" content="Dareloop — Join Challenges. Build Streaks. Change Your Life." />
    <meta property="og:description" content="Join challenges, track streaks, compete on leaderboards, and stay accountable with a community that keeps you going. Free to join." />
    <meta property="og:image" content="https://www.dareloop.app/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@dareloop" />
    <meta name="twitter:creator" content="@dareloop" />
    <meta name="twitter:url" content="https://www.dareloop.app/" />
    <meta name="twitter:title" content="Dareloop — Join Challenges. Build Streaks. Change Your Life." />
    <meta name="twitter:description" content="Join challenges, track streaks, compete on leaderboards, and stay accountable. Free to join." />
    <meta name="twitter:image" content="https://www.dareloop.app/og-default.png" />

    <!-- Structured Data: WebApplication (fallback, overridden per-page) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Dareloop",
      "url": "https://www.dareloop.app",
      "description": "A gamified challenge and accountability platform where users join, create, and complete 30-day challenges with streak tracking and community leaderboards.",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web",
      "inLanguage": "en",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Dareloop",
        "url": "https://www.dareloop.app"
      }
    }
    </script>

    <!-- Preconnect to Google Fonts CDN before any render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load Inter non-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>
    <!-- Google Sign-In — async + defer so it never blocks parsing -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
